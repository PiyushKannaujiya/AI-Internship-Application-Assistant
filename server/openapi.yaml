      responses:
        '200':
          description: Plan with safety.autoSubmit false and finalSubmissionRequiresHuman true
        '404':
          $ref: '#/components/responses/NotFound'
  /applications/{id}/autofill-runs:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Autofill]
      summary: List local helper run reports for an application
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 50
      responses:
        '200':
          description: Run reports, always with submitted false
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Autofill]
      summary: Record what the local helper did (never a submission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapter]
              properties:
                adapter:
                  type: string
                  enum: [greenhouse, lever, ashby, linkedin, workday, generic]
                pageUrl:
                  type: string
                status:
                  type: string
                  enum: [prepared, needs_review, failed]
                filledFields:
                  type: array
                  items:
                    type: object
                    properties:
                      canonical:
                        type: string
                      label:
                        type: string
                      selector:
                        type: string
                missingFields:
                  type: array
                  items:
                    type: object
                    properties:
                      canonical:
                        type: string
                      label:
                        type: string
                      reason:
                        type: string
                validationErrors:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      message:
                        type: string
                unsupportedControls:
                  type: array
                  items:
                    type: string
                blockedBy:
                  type: array
                  items:
                    type: string
                    enum: [captcha, otp, mfa, login, terms, unsupported_form]
                resumeUploaded:
                  type: object
                  nullable: true
                  properties:
                    format:
                      type: string
                      enum: [pdf, docx]
                    fileName:
                      type: string
                coverLetterFilled:
                  type: boolean
                answersFilled:
                  type: array
                  items:
                    type: string
                submitted:
                  type: boolean
                  description: Only false is accepted; true returns 400
                notes:
                  type: string
      responses:
        '201':
          description: Run recorded with submitted false
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
